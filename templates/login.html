<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InternTrack - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .auth-container {
            max-width: 450px;
            margin: 70px auto;
        }

        .auth-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .auth-card h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            color: #555;
        }

        .auth-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            InternTrack
        </div>

        <div class="nav-links">

            <a href="/">
                Dashboard
            </a>

            <a href="/internships">
                Internships
            </a>

            <a href="/applications">
                Applications
            </a>

            <a href="/interviews">
                Interviews
            </a>

            <a href="/register">
                Register
            </a>

        </div>

    </nav>


    <!-- Login -->
    <main class="auth-container">

        <div class="auth-card">

            <h1>Login to InternTrack</h1>

            <p class="auth-subtitle">
                Sign in to manage your internship applications.
            </p>


            <form method="POST">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button">
                    Login
                </button>

            </form>


            <div class="auth-footer">

                Don't have an account?

                <a href="/register">
                    Create an account
                </a>

            </div>

        </div>

    </main>

</body>

</html>
